<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Milo India</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      background: #f5f7fb;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      background: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px;
      text-align: center;
    }

    .logo {
      width: 90px;
      height: 90px;
      border-radius: 25px;
      background: #111827;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      font-weight: bold;
      margin-bottom: 25px;
    }

    h1 {
      font-size: 34px;
      margin-bottom: 10px;
      color: #111827;
    }

    .tagline {
      color: #6b7280;
      font-size: 16px;
      line-height: 1.5;
      margin-bottom: 35px;
    }

    .start-btn {
      width: 100%;
      max-width: 320px;
      border: none;
      border-radius: 14px;
      padding: 16px;
      font-size: 17px;
      font-weight: bold;
      background: #111827;
      color: white;
      cursor: pointer;
    }

    .start-btn:active {
      transform: scale(0.98);
    }

    .notice {
      margin-top: 18px;
      font-size: 12px;
      color: #9ca3af;
      max-width: 320px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <main class="app">

    <div class="logo">M</div>

    <h1>Milo India</h1>

    <p class="tagline">
      Meet new people through random video calls.
    </p>

    <button class="start-btn" onclick="startApp()">
      Get Started
    </button>

    <p class="notice">
      By continuing, you agree to use Milo India responsibly
      and follow our community safety rules.
    </p>

  </main>

  <script>
    function startApp() {
      window.location.href = "login.html";
    }
  </script>

</body>
</html>
