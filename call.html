<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Milo India - Video Call</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #000;
      min-height: 100vh;
      color: white;
    }

    .call {
      width: 100%;
      min-height: 100vh;
      position: relative;
      overflow: hidden;
      background: #111;
    }

    .remote-video {
      width: 100%;
      height: 100vh;
      object-fit: cover;
      background: #181818;
    }

    .local-video {
      position: absolute;
      right: 15px;
      top: 15px;
      width: 120px;
      height: 170px;
      object-fit: cover;
      border-radius: 14px;
      background: #333;
      border: 2px solid white;
      z-index: 6;
    }

    .top {
      position: absolute;
      top: 15px;
      left: 70px;
      right: 150px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 5;
    }

    .title {
      font-size: 18px;
      font-weight: bold;
    }

    .timer {
      font-size: 14px;
      background: rgba(0,0,0,0.55);
      padding: 7px 10px;
      border-radius: 10px;
    }

    .status {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: #ddd;
      z-index: 4;
      font-size: 16px;
      width: 90%;
    }

    .controls {
      position: absolute;
      bottom: 30px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 14px;
      z-index: 10;
    }

    .control {
      width: 54px;
      height: 54px;
      border: none;
      border-radius: 50%;
      background: rgba(255,255,255,0.18);
      color: white;
      font-size: 20px;
      cursor: pointer;
    }

    .control.off {
      background: #555;
    }

    .end {
      width: 60px;
      height: 60px;
      border: none;
      border-radius: 50%;
      background: #dc2626;
      color: white;
      font-size: 22px;
      cursor: pointer;
    }

    .back {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 20;
      border: none;
      background: rgba(0,0,0,0.55);
      color: white;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <main class="call">

    <video
      id="remoteVideo"
      class="remote-video"
      autoplay
      playsinline>
    </video>

    <video
      id="localVideo"
      class="local-video"
      autoplay
      muted
      playsinline>
    </video>


    <button id="backButton" class="back">
      ←
    </button>


    <div class="top">

      <div class="title">
        Milo India
      </div>

      <div id="timer" class="timer">
        00:00
      </div>

    </div>


    <div id="status" class="status">
      Connecting...
    </div>


    <div class="controls">

      <button
        id="micButton"
        class="control">
        🎤
      </button>

      <button
        id="cameraButton"
        class="control">
        📷
      </button>

      <button
        id="endButton"
        class="end">
        ☎
      </button>

    </div>

  </main>


  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


    import {
      getAuth,
      onAuthStateChanged
    }
      from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    import {
      getFirestore,
      doc,
      getDoc,
      updateDoc,
      collection,
      addDoc,
      onSnapshot,
      serverTimestamp
    }
      from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    import { firebaseConfig }
      from "./firebase-config.js";


    const app =
      initializeApp(firebaseConfig);


    const auth =
      getAuth(app);


    const db =
      getFirestore(app);


    const localVideo =
      document.getElementById("localVideo");


    const remoteVideo =
      document.getElementById("remoteVideo");


    const status =
      document.getElementById("status");


    const timer =
      document.getElementById("timer");


    const micButton =
      document.getElementById("micButton");


    const cameraButton =
      document.getElementById("cameraButton");


    const endButton =
      document.getElementById("endButton");


    const backButton =
      document.getElementById("backButton");


    const params =
      new URLSearchParams(
        window.location.search
      );


    const callId =
      params.get("callId");


    const role =
      params.get("role");


    let currentUser = null;

    let localStream = null;

    let peerConnection = null;

    let seconds = 0;

    let timerInterval = null;

    let callUnsubscribe = null;

    let candidateUnsubscribe = null;


    const rtcConfig = {

      iceServers: [

        {
          urls:
            "stun:stun.l.google.com:19302"
        }

      ]

    };


    onAuthStateChanged(
      auth,
      async function(user) {

        if (!user) {

          window.location.href =
            "login.html";

          return;

        }


        currentUser = user;


        if (!callId || !role) {

          status.textContent =
            "Invalid call.";

          return;

        }


        await startCall();

      }
    );


    async function startCall() {

      status.textContent =
        "Starting camera...";


      try {

        localStream =
          await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: true
          });


        localVideo.srcObject =
          localStream;


      } catch (error) {

        console.error(
          "Camera error:",
          error
        );


        status.textContent =
          "Camera and microphone permission is required.";

        return;

      }


      createPeerConnection();


      if (role === "caller") {

        await startAsCaller();

      }

      else if (role === "receiver") {

        await startAsReceiver();

      }

      else {

        status.textContent =
          "Invalid call role.";

      }

    }


    function createPeerConnection() {

      peerConnection =
        new RTCPeerConnection(
          rtcConfig
        );


      localStream
        .getTracks()
        .forEach(function(track) {

          peerConnection.addTrack(
            track,
            localStream
          );

        });


      peerConnection.ontrack =
        function(event) {

          if (event.streams[0]) {

            remoteVideo.srcObject =
              event.streams[0];

            status.textContent =
              "Connected";

            startTimer();

          }

        };


      peerConnection.onicecandidate =
        async function(event) {

          if (!event.candidate) {
            return;
          }


          try {

            const collectionName =
              role === "caller"
                ? "callerCandidates"
                : "receiverCandidates";


            await addDoc(
              collection(
                db,
                "calls",
                callId,
                collectionName
              ),
              event.candidate.toJSON()
            );


          } catch (error) {

            console.error(
              "ICE candidate error:",
              error
            );

          }

        };


      peerConnection.onconnectionstatechange =
        function() {

          if (!peerConnection) {
            return;
          }


          const state =
            peerConnection.connectionState;


          console.log(
            "Connection state:",
            state
          );


          if (state === "connected") {

            status.textContent =
              "Connected";

            startTimer();

          }


          if (state === "connecting") {

            status.textContent =
              "Connecting...";

          }


          if (
            state === "disconnected" ||
            state === "failed" ||
            state === "closed"
          ) {

            status.textContent =
              "Call ended";

          }

        };

    }


    async function startAsCaller() {

      status.textContent =
        "Calling...";


      const offer =
        await peerConnection.createOffer();


      await peerConnection.setLocalDescription(
        offer
      );


      await updateDoc(
        doc(db, "calls", callId),
        {
          offer: {
            type: offer.type,
            sdp: offer.sdp
          },
          status: "calling"
        }
      );


      listenForAnswer();

      listenForReceiverCandidates();

    }


    async function startAsReceiver() {

      status.textContent =
        "Joining call...";


      const callRef =
        doc(
          db,
          "calls",
          callId
        );


      const callSnapshot =
        await getDoc(callRef);


      if (!callSnapshot.exists()) {

        status.textContent =
          "Call not found.";

        return;

      }


      const callData =
        callSnapshot.data();


      if (!callData.offer) {

        status.textContent =
          "Waiting for caller...";


        const stop =
          onSnapshot(
            callRef,
            async function(snapshot) {

              const data =
                snapshot.data();


              if (
                data &&
                data.offer
              ) {

                stop();

                await createAnswer(
                  data.offer
                );

              }

            }
          );


        return;

      }


      await createAnswer(
        callData.offer
      );

    }


    async function createAnswer(
      offer
    ) {

      await peerConnection.setRemoteDescription(
        new RTCSessionDescription(offer)
      );


      const answer =
        await peerConnection.createAnswer();


      await peerConnection.setLocalDescription(
        answer
      );


      await updateDoc(
        doc(db, "calls", callId),
        {
          answer: {
            type: answer.type,
            sdp: answer.sdp
          },
          status: "connected"
        }
      );


      listenForCallerCandidates();

    }


    function listenForAnswer() {

      const callRef =
        doc(
          db,
          "calls",
          callId
        );


      callUnsubscribe =
        onSnapshot(
          callRef,
          async function(snapshot) {

            const data =
              snapshot.data();


            if (
              !data ||
              !data.answer
            ) {

              return;

            }


            if (
              peerConnection
                .currentRemoteDescription
            ) {

              return;

            }


            try {

              await peerConnection.setRemoteDescription(
                new RTCSessionDescription(
                  data.answer
                )
              );


              status.textContent =
                "Connecting...";

            } catch (error) {

              console.error(
                "Answer error:",
                error
              );

            }

          }
        );

    }


    function listenForReceiverCandidates() {

      const candidatesRef =
        collection(
          db,
          "calls",
          callId,
          "receiverCandidates"
        );


      candidateUnsubscribe =
        onSnapshot(
          candidatesRef,
          function(snapshot) {

            snapshot.docChanges()
              .forEach(
                async function(change) {

                  if (
                    change.type !== "added"
                  ) {

                    return;

                  }


                  const data =
                    change.doc.data();


                  try {

                    await peerConnection.addIceCandidate(
                      new RTCIceCandidate(
                        data
                      )
                    );

                  } catch (error) {

                    console.error(
                      "Receiver ICE error:",
                      error
                    );

                  }

                }
              );

          }
        );

    }


    function listenForCallerCandidates() {

      const candidatesRef =
        collection(
          db,
          "calls",
          callId,
          "callerCandidates"
        );


      candidateUnsubscribe =
        onSnapshot(
          candidatesRef,
          function(snapshot) {

            snapshot.docChanges()
              .forEach(
                async function(change) {

                  if (
                    change.type !== "added"
                  ) {

                    return;

                  }


                  const data =
                    change.doc.data();


                  try {

                    await peerConnection.addIceCandidate(
                      new RTCIceCandidate(
                        data
                      )
                    );

                  } catch (error) {

                    console.error(
                      "Caller ICE error:",
                      error
                    );

                  }

                }
              );

          }
        );

    }


    function startTimer() {

      if (timerInterval) {
        return;
      }


      timerInterval =
        setInterval(
          function() {

            seconds++;


            const minutes =
              Math.floor(
                seconds / 60
              );


            const remainingSeconds =
              seconds % 60;


            timer.textContent =
              String(minutes)
                .padStart(2, "0")
              + ":" +
              String(remainingSeconds)
                .padStart(2, "0");

          },
          1000
        );

    }


    micButton.addEventListener(
      "click",
      function() {

        if (!localStream) {
          return;
        }


        const tracks =
          localStream.getAudioTracks();


        tracks.forEach(
          function(track) {

            track.enabled =
              !track.enabled;


            micButton.classList.toggle(
              "off",
              !track.enabled
            );

          }
        );

      }
    );


    cameraButton.addEventListener(
      "click",
      function() {

        if (!localStream) {
          return;
        }


        const tracks =
          localStream.getVideoTracks();


        tracks.forEach(
          function(track) {

            track.enabled =
              !track.enabled;


            cameraButton.classList.toggle(
              "off",
              !track.enabled
            );

          }
        );

      }
    );


    endButton.addEventListener(
      "click",
      function() {

        endCall();

      }
    );


    backButton.addEventListener(
      "click",
      function() {

        endCall();

      }
    );


    async function endCall() {

      try {

        await updateDoc(
          doc(db, "calls", callId),
          {
            status: "ended",
            endedAt: serverTimestamp()
          }
        );

      } catch (error) {

        console.error(
          "End call error:",
          error
        );

      }


      cleanup();

      window.location.href =
        "home.html";

    }


    function cleanup() {

      if (timerInterval) {

        clearInterval(
          timerInterval
        );

        timerInterval = null;

      }


      if (callUnsubscribe) {

        callUnsubscribe();

        callUnsubscribe = null;

      }


      if (candidateUnsubscribe) {

        candidateUnsubscribe();

        candidateUnsubscribe = null;

      }


      if (localStream) {

        localStream
          .getTracks()
          .forEach(
            function(track) {

              track.stop();

            }
          );

        localStream = null;

      }


      if (peerConnection) {

        peerConnection.close();

        peerConnection = null;

      }

    }

  </script>

</body>
</html>
