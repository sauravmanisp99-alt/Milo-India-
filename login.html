<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Milo India - Google Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      background: #f5f7fb;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      background: #ffffff;
      padding: 30px 25px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .back {
      position: absolute;
      top: 25px;
      left: 20px;
      border: none;
      background: transparent;
      font-size: 28px;
      cursor: pointer;
      color: #111827;
    }

    .logo {
      width: 80px;
      height: 80px;
      border-radius: 22px;
      background: #111827;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      font-weight: bold;
      margin-bottom: 25px;
    }

    h1 {
      color: #111827;
      font-size: 30px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #6b7280;
      font-size: 16px;
      line-height: 1.5;
      margin-bottom: 35px;
    }

    .google-button {
      width: 100%;
      min-height: 54px;
      border: 1px solid #d1d5db;
      border-radius: 13px;
      background: #ffffff;
      color: #111827;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .google-button:active {
      transform: scale(0.98);
    }

    .google-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .google-icon {
      font-size: 20px;
      font-weight: bold;
    }

    .message {
      margin-top: 20px;
      min-height: 22px;
      text-align: center;
      color: #374151;
      font-size: 14px;
      line-height: 1.5;
    }

    .small {
      margin-top: 30px;
      color: #9ca3af;
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
    }
  </style>
</head>

<body>

  <main class="app">

    <button id="backButton" class="back" aria-label="Go back">
      ←
    </button>

    <div class="logo">
      M
    </div>

    <h1>Welcome to Milo</h1>

    <p class="subtitle">
      Sign in with your Google Account to start meeting new people.
    </p>

    <button id="googleLoginButton" class="google-button">
      <span class="google-icon">G</span>
      <span>Continue with Google</span>
    </button>

    <p id="message" class="message"></p>

    <p class="small">
      By continuing, you agree to use Milo responsibly and follow
      our safety and community guidelines.
    </p>

  </main>

  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup
    }
      from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    import { firebaseConfig }
      from "./firebase-config.js";


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const provider = new GoogleAuthProvider();


    const googleButton =
      document.getElementById("googleLoginButton");

    const message =
      document.getElementById("message");

    const backButton =
      document.getElementById("backButton");


    googleButton.addEventListener("click", async function () {

      googleButton.disabled = true;

      googleButton.innerHTML =
        "<span>Signing in...</span>";

      message.textContent = "Opening Google...";


      try {

        const result =
          await signInWithPopup(auth, provider);

        const user = result.user;

        console.log("Google login successful");
        console.log("User ID:", user.uid);
        console.log("Name:", user.displayName);
        console.log("Email:", user.email);


        message.textContent =
          "Login successful. Opening profile...";


        setTimeout(function () {

          window.location.href = "profile.html";

        }, 800);


      } catch (error) {

        console.error("Google Login Error:", error);

        googleButton.disabled = false;

        googleButton.innerHTML =
          '<span class="google-icon">G</span>' +
          '<span>Continue with Google</span>';


        if (error.code === "auth/popup-closed-by-user") {

          message.textContent =
            "Google login was cancelled.";

        }

        else if (error.code === "auth/popup-blocked") {

          message.textContent =
            "Google popup was blocked. Allow popups and try again.";

        }

        else if (error.code === "auth/unauthorized-domain") {

          message.textContent =
            "This website is not authorized in Firebase.";

        }

        else {

          message.textContent =
            "Google login failed: " + error.code;

        }

      }

    });


    backButton.addEventListener("click", function () {

      window.location.href = "index.html";

    });

  </script>

</body>
</html>
