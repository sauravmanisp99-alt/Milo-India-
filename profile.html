<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Milo India - Profile</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      background: white;
      padding: 35px 25px;
    }

    .logo {
      width: 70px;
      height: 70px;
      border-radius: 20px;
      background: #111827;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      font-weight: bold;
      margin-bottom: 25px;
    }

    h1 {
      font-size: 28px;
      color: #111827;
      margin-bottom: 8px;
    }

    .welcome {
      color: #6b7280;
      margin-bottom: 30px;
      line-height: 1.5;
    }

    .field {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      color: #374151;
      margin-bottom: 8px;
    }

    input,
    select {
      width: 100%;
      height: 52px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      padding: 0 15px;
      font-size: 16px;
      background: white;
      color: #111827;
    }

    .continue-btn {
      width: 100%;
      height: 54px;
      border: none;
      border-radius: 13px;
      background: #111827;
      color: white;
      font-size: 16px;
      font-weight: bold;
      margin-top: 10px;
      cursor: pointer;
    }

    .continue-btn:disabled {
      opacity: 0.6;
    }

    .message {
      min-height: 22px;
      text-align: center;
      margin-top: 18px;
      font-size: 14px;
      color: #374151;
    }
  </style>
</head>

<body>

  <main class="app">

    <div class="logo">M</div>

    <h1>Complete Profile</h1>

    <p id="welcomeText" class="welcome">
      Tell us a few details before you start.
    </p>

    <div class="field">
      <label for="age">Age</label>

      <input
        id="age"
        type="number"
        min="18"
        max="100"
        placeholder="Enter your age"
      >
    </div>

    <div class="field">
      <label for="gender">Gender</label>

      <select id="gender">
        <option value="">Select gender</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Other">Other</option>
      </select>
    </div>

    <div class="field">
      <label for="country">Country</label>

      <select id="country">

        <option value="">Select country</option>

        <option value="India">India</option>
        <option value="United Arab Emirates">United Arab Emirates</option>
        <option value="United Kingdom">United Kingdom</option>
        <option value="United States">United States</option>
        <option value="Canada">Canada</option>
        <option value="Australia">Australia</option>
        <option value="Other">Other</option>

      </select>
    </div>

    <button id="continueButton" class="continue-btn">
      Continue
    </button>

    <p id="message" class="message"></p>

  </main>


  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged
    }
      from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    import {
      getFirestore,
      doc,
      setDoc,
      serverTimestamp
    }
      from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

    import { firebaseConfig }
      from "./firebase-config.js";


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);


    const ageInput =
      document.getElementById("age");

    const genderInput =
      document.getElementById("gender");

    const countryInput =
      document.getElementById("country");

    const continueButton =
      document.getElementById("continueButton");

    const message =
      document.getElementById("message");

    const welcomeText =
      document.getElementById("welcomeText");


    let currentUser = null;


    onAuthStateChanged(auth, function(user) {

      if (!user) {

        window.location.href = "login.html";

        return;

      }


      currentUser = user;


      const name =
        user.displayName || "there";


      welcomeText.textContent =
        "Welcome, " + name + ". Add these three details to continue.";

    });


    continueButton.addEventListener("click", async function() {

      const age =
        Number(ageInput.value);

      const gender =
        genderInput.value;

      const country =
        countryInput.value;


      if (!age || age < 18 || age > 100) {

        message.textContent =
          "Please enter a valid age (18+).";

        return;

      }


      if (!gender) {

        message.textContent =
          "Please select your gender.";

        return;

      }


      if (!country) {

        message.textContent =
          "Please select your country.";

        return;

      }


      if (!currentUser) {

        message.textContent =
          "Please wait for Google login.";

        return;

      }


      continueButton.disabled = true;

      continueButton.textContent =
        "Saving...";

      message.textContent = "";


      try {

        await setDoc(
          doc(db, "users", currentUser.uid),
          {
            name: currentUser.displayName || "",
            age: age,
            gender: gender,
            country: country,
            online: true,
            createdAt: serverTimestamp(),
            lastSeen: serverTimestamp()
          },
          { merge: true }
        );


        message.textContent =
          "Profile saved. Opening Milo...";


        setTimeout(function() {

          window.location.href =
            "home.html";

        }, 700);


      } catch (error) {

        console.error(
          "Profile Save Error:",
          error
        );


        continueButton.disabled = false;

        continueButton.textContent =
          "Continue";


        message.textContent =
          "Could not save profile. Please try again.";

      }

    });

  </script>

</body>
</html>
