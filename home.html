<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Milo India</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      background: white;
      padding: 25px 18px 30px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .brand {
      font-size: 27px;
      font-weight: bold;
      color: #111827;
    }

    .status {
      font-size: 13px;
      color: #16a34a;
      font-weight: bold;
    }

    .hero {
      background: #111827;
      color: white;
      border-radius: 20px;
      padding: 25px 20px;
      margin-bottom: 25px;
    }

    .hero h1 {
      font-size: 25px;
      margin-bottom: 9px;
    }

    .hero p {
      color: #d1d5db;
      line-height: 1.5;
      font-size: 14px;
    }

    .random-btn {
      width: 100%;
      height: 56px;
      border: none;
      border-radius: 14px;
      background: white;
      color: #111827;
      font-size: 16px;
      font-weight: bold;
      margin-top: 20px;
      cursor: pointer;
    }

    .random-btn:disabled {
      opacity: 0.6;
    }

    .section-title {
      font-size: 20px;
      font-weight: bold;
      color: #111827;
      margin-bottom: 15px;
    }

    .users {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .user-card {
      border: 1px solid #e5e7eb;
      border-radius: 15px;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .user-info h3 {
      font-size: 16px;
      color: #111827;
      margin-bottom: 5px;
    }

    .user-info p {
      font-size: 13px;
      color: #6b7280;
    }

    .online {
      color: #16a34a;
      font-size: 12px;
      font-weight: bold;
    }

    .empty {
      text-align: center;
      color: #9ca3af;
      padding: 30px 10px;
      font-size: 14px;
    }

    .message {
      text-align: center;
      color: #6b7280;
      font-size: 14px;
      margin-top: 18px;
      min-height: 20px;
    }


    /* INCOMING CALL */

    .incoming {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }

    .incoming.show {
      display: flex;
    }

    .incoming-box {
      width: 100%;
      max-width: 360px;
      background: white;
      border-radius: 22px;
      padding: 28px 22px;
      text-align: center;
    }

    .incoming-icon {
      width: 75px;
      height: 75px;
      border-radius: 50%;
      background: #111827;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 18px;
      font-size: 30px;
    }

    .incoming-box h2 {
      color: #111827;
      font-size: 23px;
      margin-bottom: 8px;
    }

    .incoming-box p {
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 22px;
    }

    .incoming-buttons {
      display: flex;
      gap: 12px;
    }

    .incoming-buttons button {
      flex: 1;
      height: 52px;
      border: none;
      border-radius: 13px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .decline {
      background: #e5e7eb;
      color: #111827;
    }

    .accept {
      background: #16a34a;
      color: white;
    }

  </style>
</head>

<body>

  <main class="app">

    <header class="header">
      <div class="brand">Milo India</div>
      <div class="status">● Online</div>
    </header>


    <section class="hero">

      <h1>Meet someone new</h1>

      <p>
        Start a random 1-to-1 video call with another online user.
      </p>

      <button
        id="randomButton"
        class="random-btn">
        🎥 Start Random Video Call
      </button>

    </section>


    <h2 class="section-title">
      Live Online People
    </h2>


    <section
      id="users"
      class="users">

      <div class="empty">
        Finding online people...
      </div>

    </section>


    <p
      id="message"
      class="message">
    </p>

  </main>


  <!-- INCOMING CALL -->

  <div
    id="incomingCall"
    class="incoming">

    <div class="incoming-box">

      <div class="incoming-icon">
        📹
      </div>

      <h2>
        Incoming Video Call
      </h2>

      <p>
        Someone wants to start a random video call with you.
      </p>

      <div class="incoming-buttons">

        <button
          id="declineButton"
          class="decline">
          Decline
        </button>

        <button
          id="acceptButton"
          class="accept">
          Accept
        </button>

      </div>

    </div>

  </div>


  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


    import {
      getAuth,
      onAuthStateChanged
    }
      from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    import {
      getFirestore,
      collection,
      query,
      where,
      onSnapshot,
      addDoc,
      doc,
      updateDoc
    }
      from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    import { firebaseConfig }
      from "./firebase-config.js";


    const app =
      initializeApp(firebaseConfig);


    const auth =
      getAuth(app);


    const db =
      getFirestore(app);


    const usersContainer =
      document.getElementById("users");


    const randomButton =
      document.getElementById("randomButton");


    const message =
      document.getElementById("message");


    const incomingCall =
      document.getElementById("incomingCall");


    const acceptButton =
      document.getElementById("acceptButton");


    const declineButton =
      document.getElementById("declineButton");


    let currentUser = null;

    let onlineUsers = [];

    let incomingCallId = null;

    let incomingCallerId = null;

    let callListener = null;


    onAuthStateChanged(
      auth,
      function(user) {

        if (!user) {

          window.location.href =
            "login.html";

          return;

        }


        currentUser = user;

        loadOnlineUsers();

        listenForIncomingCalls();

      }
    );


    /* ONLINE USERS */

    function loadOnlineUsers() {

      const usersQuery =
        query(
          collection(db, "users"),
          where("online", "==", true)
        );


      onSnapshot(
        usersQuery,

        function(snapshot) {

          onlineUsers = [];

          usersContainer.innerHTML = "";


          snapshot.forEach(
            function(userDoc) {

              const data =
                userDoc.data();


              if (
                userDoc.id ===
                currentUser.uid
              ) {

                return;

              }


              if (
                !data.age ||
                data.age < 18
              ) {

                return;

              }


              onlineUsers.push({
                id: userDoc.id,
                ...data
              });

            }
          );


          if (
            onlineUsers.length === 0
          ) {

            usersContainer.innerHTML =
              '<div class="empty">' +
              'No other people are online right now.' +
              '</div>';

            return;

          }


          onlineUsers.forEach(
            function(user) {

              const card =
                document.createElement(
                  "div"
                );


              card.className =
                "user-card";


              card.innerHTML =

                '<div class="user-info">' +

                '<h3>' +
                "Milo User" +
                '</h3>' +

                '<p>' +
                user.age +
                " • " +
                user.gender +
                " • " +
                user.country +
                '</p>' +

                '</div>' +

                '<div class="online">' +
                '● Online' +
                '</div>';


              usersContainer.appendChild(
                card
              );

            }
          );

        },


        function(error) {

          console.error(
            "Online Users Error:",
            error
          );


          message.textContent =
            "Could not load online people.";

        }
      );

    }


    /* START RANDOM CALL */

    randomButton.addEventListener(
      "click",
      async function() {

        if (!currentUser) {

          return;

        }


        if (
          onlineUsers.length === 0
        ) {

          message.textContent =
            "No other online users are available right now.";

          return;

        }


        const randomIndex =
          Math.floor(
            Math.random() *
            onlineUsers.length
          );


        const selectedUser =
          onlineUsers[randomIndex];


        randomButton.disabled =
          true;


        randomButton.textContent =
          "Finding a person...";


        message.textContent =
          "Creating video call...";


        try {

          const callData = {

            callerId:
              currentUser.uid,

            receiverId:
              selectedUser.id,

            status:
              "ringing",

            createdAt:
              new Date()

          };


          const callRef =
            await addDoc(
              collection(db, "calls"),
              callData
            );


          console.log(
            "Call created:",
            callRef.id
          );


          window.location.href =
            "call.html?callId=" +
            encodeURIComponent(
              callRef.id
            ) +
            "&role=caller";


        } catch (error) {

          console.error(
            "Create Call Error:",
            error
          );


          randomButton.disabled =
            false;


          randomButton.textContent =
            "🎥 Start Random Video Call";


          message.textContent =
            "Could not create video call.";

        }

      }
    );


    /* INCOMING CALL LISTENER */

    function listenForIncomingCalls() {

      const incomingQuery =
        query(
          collection(db, "calls"),
          where(
            "receiverId",
            "==",
            currentUser.uid
          ),
          where(
            "status",
            "==",
            "ringing"
          )
        );


      callListener =
        onSnapshot(
          incomingQuery,

          function(snapshot) {

            snapshot.docChanges()
              .forEach(
                function(change) {

                  if (
                    change.type !==
                    "added"
                  ) {

                    return;

                  }


                  const data =
                    change.doc.data();


                  incomingCallId =
                    change.doc.id;


                  incomingCallerId =
                    data.callerId;


                  incomingCall.classList.add(
                    "show"
                  );

                }
              );

          },


          function(error) {

            console.error(
              "Incoming Call Error:",
              error
            );

          }
        );

    }


    /* ACCEPT */

    acceptButton.addEventListener(
      "click",
      async function() {

        if (!incomingCallId) {

          return;

        }


        const acceptedCallId =
          incomingCallId;


        incomingCall.classList.remove(
          "show"
        );


        window.location.href =
          "call.html?callId=" +
          encodeURIComponent(
            acceptedCallId
          ) +
          "&role=receiver";

      }
    );


    /* DECLINE */

    declineButton.addEventListener(
      "click",
      async function() {

        if (!incomingCallId) {

          incomingCall.classList.remove(
            "show"
          );

          return;

        }


        try {

          await updateDoc(
            doc(
              db,
              "calls",
              incomingCallId
            ),
            {
              status: "declined"
            }
          );

        } catch (error) {

          console.error(
            "Decline Error:",
            error
          );

        }


        incomingCallId = null;

        incomingCallerId = null;


        incomingCall.classList.remove(
          "show"
        );

      }
    );

  </script>

</body>
</html>
