<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Milo India</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      background: white;
      padding: 25px 18px 30px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .brand {
      font-size: 27px;
      font-weight: bold;
      color: #111827;
    }

    .status {
      font-size: 13px;
      color: #16a34a;
      font-weight: bold;
    }

    .hero {
      background: #111827;
      color: white;
      border-radius: 20px;
      padding: 25px 20px;
      margin-bottom: 25px;
    }

    .hero h1 {
      font-size: 25px;
      margin-bottom: 9px;
    }

    .hero p {
      color: #d1d5db;
      line-height: 1.5;
      font-size: 14px;
    }

    .random-btn {
      width: 100%;
      height: 56px;
      border: none;
      border-radius: 14px;
      background: white;
      color: #111827;
      font-size: 16px;
      font-weight: bold;
      margin-top: 20px;
      cursor: pointer;
    }

    .random-btn:disabled {
      opacity: 0.6;
    }

    .section-title {
      font-size: 20px;
      font-weight: bold;
      color: #111827;
      margin-bottom: 15px;
    }

    .users {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .user-card {
      border: 1px solid #e5e7eb;
      border-radius: 15px;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .user-info {
      min-width: 0;
      flex: 1;
    }

    .user-info h3 {
      font-size: 16px;
      color: #111827;
      margin-bottom: 5px;
    }

    .user-info p {
      font-size: 13px;
      color: #6b7280;
    }

    .online {
      color: #16a34a;
      font-size: 12px;
      font-weight: bold;
      white-space: nowrap;
    }

    .user-actions {
      display: flex;
      gap: 6px;
      margin-top: 10px;
    }

    .small-btn {
      border: none;
      border-radius: 9px;
      padding: 7px 9px;
      font-size: 11px;
      cursor: pointer;
      font-weight: bold;
    }

    .block-btn {
      background: #fee2e2;
      color: #b91c1c;
    }

    .report-btn {
      background: #fef3c7;
      color: #92400e;
    }

    .empty {
      text-align: center;
      color: #9ca3af;
      padding: 30px 10px;
      font-size: 14px;
    }

    .message {
      text-align: center;
      color: #6b7280;
      font-size: 14px;
      margin-top: 18px;
      min-height: 20px;
    }

    .incoming {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }

    .incoming.show {
      display: flex;
    }

    .incoming-box {
      width: 100%;
      max-width: 360px;
      background: white;
      border-radius: 22px;
      padding: 28px 22px;
      text-align: center;
    }

    .incoming-icon {
      width: 75px;
      height: 75px;
      border-radius: 50%;
      background: #111827;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 18px;
      font-size: 30px;
    }

    .incoming-box h2 {
      color: #111827;
      font-size: 23px;
      margin-bottom: 8px;
    }

    .incoming-box p {
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 22px;
    }

    .incoming-buttons {
      display: flex;
      gap: 12px;
    }

    .incoming-buttons button {
      flex: 1;
      height: 52px;
      border: none;
      border-radius: 13px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .decline {
      background: #e5e7eb;
      color: #111827;
    }

    .accept {
      background: #16a34a;
      color: white;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 200;
    }

    .modal.show {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 360px;
      background: white;
      border-radius: 20px;
      padding: 24px;
    }

    .modal-box h2 {
      font-size: 21px;
      color: #111827;
      margin-bottom: 8px;
    }

    .modal-box p {
      color: #6b7280;
      font-size: 13px;
      margin-bottom: 18px;
      line-height: 1.5;
    }

    .report-option {
      width: 100%;
      padding: 13px;
      margin-bottom: 9px;
      border: 1px solid #e5e7eb;
      border-radius: 11px;
      background: white;
      text-align: left;
      cursor: pointer;
      font-size: 14px;
    }

    .cancel-btn {
      width: 100%;
      height: 45px;
      border: none;
      border-radius: 11px;
      background: #111827;
      color: white;
      font-weight: bold;
      margin-top: 8px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <main class="app">

    <header class="header">
      <div class="brand">Milo India</div>
      <div class="status">● Online</div>
    </header>

    <section class="hero">

      <h1>Meet someone new</h1>

      <p>
        Start a random 1-to-1 video call with another online user.
      </p>

      <button id="randomButton" class="random-btn">
        🎥 Start Random Video Call
      </button>

    </section>

    <h2 class="section-title">
      Live Online People
    </h2>

    <section id="users" class="users">

      <div class="empty">
        Finding online people...
      </div>

    </section>

    <p id="message" class="message"></p>

  </main>

  <div id="incomingCall" class="incoming">

    <div class="incoming-box">

      <div class="incoming-icon">
        📹
      </div>

      <h2>
        Incoming Video Call
      </h2>

      <p>
        Someone wants to start a random video call with you.
      </p>

      <div class="incoming-buttons">

        <button id="declineButton" class="decline">
          Decline
        </button>

        <button id="acceptButton" class="accept">
          Accept
        </button>

      </div>

    </div>

  </div>

  <div id="reportModal" class="modal">

    <div class="modal-box">

      <h2>
        Report User
      </h2>

      <p>
        Select the reason for reporting this user.
      </p>

      <button class="report-option" data-reason="Inappropriate behavior">
        Inappropriate behavior
      </button>

      <button class="report-option" data-reason="Harassment">
        Harassment
      </button>

      <button class="report-option" data-reason="Spam or scam">
        Spam or scam
      </button>

      <button class="report-option" data-reason="Fake profile">
        Fake profile
      </button>

      <button class="report-option" data-reason="Other">
        Other
      </button>

      <button id="cancelReport" class="cancel-btn">
        Cancel
      </button>

    </div>

  </div>
  <script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  query,
  where,
  onSnapshot,
  addDoc,
  doc,
  updateDoc,
  getDocs,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

import { firebaseConfig } from "./firebase-config.js";


/* =========================
   FIREBASE
========================= */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* =========================
   ELEMENTS
========================= */

const onlineUsers = document.getElementById("onlineUsers");

const loading = document.getElementById("loading");

const incomingCallBox = document.getElementById("incomingCallBox");

const acceptCall = document.getElementById("acceptCall");

const declineCall = document.getElementById("declineCall");

const reportModal = document.getElementById("reportModal");

const reportReason = document.getElementById("reportReason");

const submitReport = document.getElementById("submitReport");

const cancelReport = document.getElementById("cancelReport");


/* =========================
   VARIABLES
========================= */

let currentUser = null;

let blockedUserIds = [];

let reportUserId = null;

let incomingCallId = null;

let incomingCallerId = null;

let callListener = null;


/* =========================
   AUTH
========================= */

onAuthStateChanged(auth, async (user) => {

  if (!user) {

    window.location.href = "index.html";

    return;

  }

  currentUser = user;

  console.log("Logged in:", currentUser.uid);

  await loadBlockedUsers();

  loadOnlineUsers();

  listenForIncomingCalls();

});


/* =========================
   LOAD BLOCKED USERS
========================= */

async function loadBlockedUsers() {

  try {

    const q = query(
      collection(db, "blocks"),
      where("blockerId", "==", currentUser.uid)
    );

    const snapshot = await getDocs(q);

    blockedUserIds = [];

    snapshot.forEach((item) => {

      const data = item.data();

      if (data.blockedUserId) {

        blockedUserIds.push(data.blockedUserId);

      }

    });

    console.log("Blocked users:", blockedUserIds);

  } catch (error) {

    console.error("Block loading error:", error);

  }

}


/* =========================
   LOAD ONLINE USERS
========================= */

function loadOnlineUsers() {

  const q = query(
    collection(db, "users"),
    where("online", "==", true)
  );

  onSnapshot(q, (snapshot) => {

    onlineUsers.innerHTML = "";

    loading.style.display = "none";

    let foundUsers = false;

    snapshot.forEach((item) => {

      const user = item.data();

      user.id = item.id;


      /* Don't show yourself */

      if (user.id === currentUser.uid) {

        return;

      }


      /* Don't show blocked users */

      if (blockedUserIds.includes(user.id)) {

        return;

      }


      /* Only 18+ */

      if (Number(user.age) < 18) {

        return;

      }


      foundUsers = true;

      const card = createUserCard(user);

      onlineUsers.appendChild(card);

    });


    if (!foundUsers) {

      onlineUsers.innerHTML = `
        <div class="empty">
          No online people right now.
        </div>
      `;

    }

  }, (error) => {

    console.error("Online users error:", error);

    loading.innerText =
      "Unable to load online users.";

  });

}


/* =========================
   CREATE USER CARD
========================= */

function createUserCard(user) {

  const card = document.createElement("div");

  card.className = "user-card";


  const name = document.createElement("h3");

  name.textContent = user.name || "Milo User";


  const info = document.createElement("p");

  info.textContent =
    `${user.age || "18+"} • ${user.gender || "Unknown"} • ${user.country || "Unknown"}`;


  const status = document.createElement("p");

  status.className = "online";

  status.textContent = "● Online";


  const actions = document.createElement("div");

  actions.className = "user-actions";


  /* CALL BUTTON */

  const callButton = document.createElement("button");

  callButton.className = "call-btn";

  callButton.textContent = "📹 Call";

  callButton.addEventListener("click", () => {

    startCall(user);

  });


  /* BLOCK BUTTON */

  const blockButton = document.createElement("button");

  blockButton.className = "small-btn block-btn";

  blockButton.textContent = "🚫 Block";

  blockButton.addEventListener("click", () => {

    blockUser(user.id);

  });


  /* REPORT BUTTON */

  const reportButton = document.createElement("button");

  reportButton.className = "small-btn report-btn";

  reportButton.textContent = "⚠️ Report";

  reportButton.addEventListener("click", () => {

    openReportModal(user.id);

  });


  actions.appendChild(callButton);

  actions.appendChild(blockButton);

  actions.appendChild(reportButton);


  card.appendChild(name);

  card.appendChild(info);

  card.appendChild(status);

  card.appendChild(actions);


  return card;

}


/* =========================
   START RANDOM VIDEO CALL
========================= */

async function startCall(selectedUser) {

  if (!currentUser) {

    return;

  }


  try {

    const callData = {

      callerId: currentUser.uid,

      receiverId: selectedUser.id,

      status: "ringing",

      createdAt: serverTimestamp()

    };


    const callRef = await addDoc(
      collection(db, "calls"),
      callData
    );


    window.location.href =
      "call.html?callId=" +
      encodeURIComponent(callRef.id) +
      "&role=caller";


  } catch (error) {

    console.error("Call error:", error);

    alert(
      "Unable to start call.\n\n" +
      error.message
    );

  }

}


/* =========================
   BLOCK USER
========================= */

async function blockUser(blockedUserId) {

  if (!currentUser) {

    return;

  }


  const confirmBlock = confirm(
    "Are you sure you want to block this user?"
  );


  if (!confirmBlock) {

    return;

  }


  try {

    await addDoc(
      collection(db, "blocks"),
      {

        blockerId: currentUser.uid,

        blockedUserId: blockedUserId,

        createdAt: serverTimestamp()

      }
    );


    /* Immediately add to local list */

    if (!blockedUserIds.includes(blockedUserId)) {

      blockedUserIds.push(blockedUserId);

    }


    /* Reload list */

    loadOnlineUsers();


    alert("User blocked successfully.");

  } catch (error) {

    console.error("Block error:", error);

    alert(
      "Unable to block user.\n\n" +
      error.message
    );

  }

}


/* =========================
   REPORT MODAL
========================= */

function openReportModal(userId) {

  reportUserId = userId;

  reportReason.value = "";

  reportModal.style.display = "flex";

}


cancelReport.addEventListener("click", () => {

  reportModal.style.display = "none";

  reportUserId = null;

});


/* Close when clicking outside */

reportModal.addEventListener("click", (event) => {

  if (event.target === reportModal) {

    reportModal.style.display = "none";

    reportUserId = null;

  }

});


/* =========================
   SUBMIT REPORT
========================= */

submitReport.addEventListener("click", async () => {

  if (!currentUser || !reportUserId) {

    return;

  }


  const reason = reportReason.value;


  if (!reason) {

    alert("Please select a reason.");

    return;

  }


  try {

    submitReport.disabled = true;

    submitReport.textContent = "Sending...";


    await addDoc(
      collection(db, "reports"),
      {

        reporterId: currentUser.uid,

        reportedUserId: reportUserId,

        reason: reason,

        status: "pending",

        createdAt: serverTimestamp()

      }
    );


    reportModal.style.display = "none";

    reportUserId = null;

    reportReason.value = "";


    alert("Report submitted successfully.");


  } catch (error) {

    console.error("Report error:", error);

    alert(
      "Unable to submit report.\n\n" +
      error.message
    );

  } finally {

    submitReport.disabled = false;

    submitReport.textContent = "Submit Report";

  }

});


/* =========================
   INCOMING CALLS
========================= */

function listenForIncomingCalls() {

  if (callListener) {

    return;

  }


  const q = query(
    collection(db, "calls"),
    where("receiverId", "==", currentUser.uid),
    where("status", "==", "ringing")
  );


  callListener = onSnapshot(q, async (snapshot) => {

    for (const item of snapshot.docChanges()) {

      if (item.type !== "added") {

        continue;

      }


      const data = item.doc.data();


      /* =========================
         BLOCKED CALLER CHECK
      ========================= */

      if (
        data.callerId &&
        blockedUserIds.includes(data.callerId)
      ) {

        try {

          await updateDoc(
            doc(db, "calls", item.doc.id),
            {
              status: "blocked"
            }
          );

        } catch (error) {

          console.error(
            "Blocked call update error:",
            error
          );

        }

        continue;

      }


      incomingCallId = item.doc.id;

      incomingCallerId = data.callerId;


      incomingCallBox.style.display = "block";

    }

  }, (error) => {

    console.error(
      "Incoming call listener error:",
      error
    );

  });

}


/* =========================
   ACCEPT CALL
========================= */

acceptCall.addEventListener("click", async () => {

  if (!incomingCallId) {

    return;

  }


  try {

    await updateDoc(
      doc(db, "calls", incomingCallId),
      {
        status: "accepted"
      }
    );


    window.location.href =
      "call.html?callId=" +
      encodeURIComponent(incomingCallId) +
      "&role=receiver";


  } catch (error) {

    console.error("Accept call error:", error);

    alert(
      "Unable to accept call.\n\n" +
      error.message
    );

  }

});


/* =========================
   DECLINE CALL
========================= */

declineCall.addEventListener("click", async () => {

  if (!incomingCallId) {

    return;

  }


  try {

    await updateDoc(
      doc(db, "calls", incomingCallId),
      {
        status: "declined"
      }
    );


    incomingCallBox.style.display = "none";

    incomingCallId = null;

    incomingCallerId = null;


  } catch (error) {

    console.error("Decline call error:", error);

  }

});

</script>

</body>
</html>
