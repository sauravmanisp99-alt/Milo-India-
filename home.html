<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Milo India</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      background: white;
      padding: 25px 18px 30px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .brand {
      font-size: 27px;
      font-weight: bold;
      color: #111827;
    }

    .status {
      font-size: 13px;
      color: #16a34a;
      font-weight: bold;
    }

    .hero {
      background: #111827;
      color: white;
      border-radius: 20px;
      padding: 25px 20px;
      margin-bottom: 25px;
    }

    .hero h1 {
      font-size: 25px;
      margin-bottom: 9px;
    }

    .hero p {
      color: #d1d5db;
      line-height: 1.5;
      font-size: 14px;
    }

    .random-btn {
      width: 100%;
      height: 56px;
      border: none;
      border-radius: 14px;
      background: white;
      color: #111827;
      font-size: 16px;
      font-weight: bold;
      margin-top: 20px;
      cursor: pointer;
    }

    .random-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .section-title {
      font-size: 20px;
      font-weight: bold;
      color: #111827;
      margin-bottom: 15px;
    }

    .users {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .user-card {
      border: 1px solid #e5e7eb;
      border-radius: 15px;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .user-info h3 {
      font-size: 16px;
      color: #111827;
      margin-bottom: 5px;
    }

    .user-info p {
      font-size: 13px;
      color: #6b7280;
    }

    .online {
      color: #16a34a;
      font-size: 12px;
      font-weight: bold;
    }

    .empty {
      text-align: center;
      color: #9ca3af;
      padding: 30px 10px;
      font-size: 14px;
    }

    .message {
      text-align: center;
      color: #6b7280;
      font-size: 14px;
      margin-top: 18px;
      min-height: 20px;
    }
  </style>
</head>

<body>

  <main class="app">

    <header class="header">
      <div class="brand">Milo India</div>
      <div class="status">● Online</div>
    </header>


    <section class="hero">

      <h1>Meet someone new</h1>

      <p>
        Start a random 1-to-1 video call with another online user.
      </p>

      <button id="randomButton" class="random-btn">
        🎥 Start Random Video Call
      </button>

    </section>


    <h2 class="section-title">
      Live Online People
    </h2>


    <section id="users" class="users">

      <div class="empty">
        Finding online people...
      </div>

    </section>


    <p id="message" class="message"></p>

  </main>


  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged
    }
      from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    import {
      getFirestore,
      collection,
      query,
      where,
      onSnapshot,
      addDoc,
      serverTimestamp
    }
      from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

    import { firebaseConfig }
      from "./firebase-config.js";


    const app =
      initializeApp(firebaseConfig);

    const auth =
      getAuth(app);

    const db =
      getFirestore(app);


    const usersContainer =
      document.getElementById("users");

    const randomButton =
      document.getElementById("randomButton");

    const message =
      document.getElementById("message");


    let currentUser = null;

    let onlineUsers = [];


    onAuthStateChanged(
      auth,
      function(user) {

        if (!user) {

          window.location.href =
            "login.html";

          return;

        }

        currentUser = user;

        loadOnlineUsers();

      }
    );


    function loadOnlineUsers() {

      const usersQuery =
        query(
          collection(db, "users"),
          where("online", "==", true)
        );


      onSnapshot(
        usersQuery,

        function(snapshot) {

          onlineUsers = [];

          usersContainer.innerHTML = "";


          snapshot.forEach(
            function(userDoc) {

              const data =
                userDoc.data();


              if (userDoc.id === currentUser.uid) {
                return;
              }


              if (!data.age || data.age < 18) {
                return;
              }


              onlineUsers.push({
                id: userDoc.id,
                ...data
              });


            }
          );


          if (onlineUsers.length === 0) {

            usersContainer.innerHTML =
              '<div class="empty">' +
              'No other people are online right now.' +
              '</div>';

            return;

          }


          onlineUsers.forEach(
            function(user) {

              const card =
                document.createElement("div");


              card.className =
                "user-card";


              card.innerHTML =

                '<div class="user-info">' +

                '<h3>' +
                "Milo User" +
                '</h3>' +

                '<p>' +
                user.age +
                " • " +
                user.gender +
                " • " +
                user.country +
                '</p>' +

                '</div>' +

                '<div class="online">' +
                '● Online' +
                '</div>';


              usersContainer.appendChild(card);

            }
          );

        },


        function(error) {

          console.error(
            "Online Users Error:",
            error
          );


          message.textContent =
            "Could not load online people.";

        }
      );

    }


    randomButton.addEventListener(
      "click",
      async function() {

        if (!currentUser) {

          message.textContent =
            "Please wait...";

          return;

        }


        if (onlineUsers.length === 0) {

          message.textContent =
            "No other online users are available right now.";

          return;

        }


        const randomIndex =
          Math.floor(
            Math.random() * onlineUsers.length
          );


        const selectedUser =
          onlineUsers[randomIndex];


        randomButton.disabled = true;

        randomButton.textContent =
          "Finding a person...";

        message.textContent =
          "Creating video call...";


        try {

          const callData = {

            callerId:
              currentUser.uid,

            receiverId:
              selectedUser.id,

            status:
              "ringing",

            createdAt:
              serverTimestamp()

          };


          const callRef =
            await addDoc(
              collection(db, "calls"),
              callData
            );


          console.log(
            "Call created:",
            callRef.id
          );


          window.location.href =
            "call.html?callId=" +
            encodeURIComponent(callRef.id) +
            "&role=caller";


        } catch (error) {

          console.error(
            "Create Call Error:",
            error
          );


          randomButton.disabled =
            false;


          randomButton.textContent =
            "🎥 Start Random Video Call";


          message.textContent =
            "Could not create video call. Please try again.";

        }

      }
    );

  </script>

</body>
</html>
