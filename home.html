<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Milo India</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      background: white;
      padding: 25px 18px 30px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .brand {
      font-size: 27px;
      font-weight: bold;
      color: #111827;
    }

    .status {
      font-size: 13px;
      color: #16a34a;
      font-weight: bold;
    }

    .hero {
      background: #111827;
      color: white;
      border-radius: 20px;
      padding: 25px 20px;
      margin-bottom: 25px;
    }

    .hero h1 {
      font-size: 25px;
      margin-bottom: 9px;
    }

    .hero p {
      color: #d1d5db;
      line-height: 1.5;
      font-size: 14px;
    }

    .random-btn {
      width: 100%;
      height: 56px;
      border: none;
      border-radius: 14px;
      background: white;
      color: #111827;
      font-size: 16px;
      font-weight: bold;
      margin-top: 20px;
      cursor: pointer;
    }

    .random-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .section-title {
      font-size: 20px;
      font-weight: bold;
      color: #111827;
      margin-bottom: 15px;
    }

    .users {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .user-card {
      border: 1px solid #e5e7eb;
      border-radius: 15px;
      padding: 16px;
    }

    .user-info {
      margin-bottom: 10px;
    }

    .user-info h3 {
      font-size: 16px;
      color: #111827;
      margin-bottom: 5px;
    }

    .user-info p {
      font-size: 13px;
      color: #6b7280;
    }

    .online {
      color: #16a34a !important;
      font-size: 12px !important;
      font-weight: bold;
      margin-top: 5px;
    }

    .user-actions {
      display: flex;
      gap: 6px;
      margin-top: 10px;
    }

    .small-btn,
    .call-btn {
      border: none;
      border-radius: 9px;
      padding: 8px 10px;
      font-size: 11px;
      cursor: pointer;
      font-weight: bold;
    }

    .call-btn {
      background: #111827;
      color: white;
    }

    .call-btn:disabled {
      opacity: 0.6;
    }

    .block-btn {
      background: #fee2e2;
      color: #b91c1c;
    }

    .report-btn {
      background: #fef3c7;
      color: #92400e;
    }

    .empty {
      text-align: center;
      color: #9ca3af;
      padding: 30px 10px;
      font-size: 14px;
    }

    .message {
      text-align: center;
      color: #6b7280;
      font-size: 14px;
      margin-top: 18px;
      min-height: 20px;
    }

    .incoming {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }

    .incoming.show {
      display: flex;
    }

    .incoming-box {
      width: 100%;
      max-width: 360px;
      background: white;
      border-radius: 22px;
      padding: 28px 22px;
      text-align: center;
    }

    .incoming-icon {
      width: 75px;
      height: 75px;
      border-radius: 50%;
      background: #111827;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 18px;
      font-size: 30px;
    }

    .incoming-box h2 {
      color: #111827;
      font-size: 23px;
      margin-bottom: 8px;
    }

    .incoming-box p {
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 22px;
    }

    .incoming-buttons {
      display: flex;
      gap: 12px;
    }

    .incoming-buttons button {
      flex: 1;
      height: 52px;
      border: none;
      border-radius: 13px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .decline {
      background: #e5e7eb;
      color: #111827;
    }

    .accept {
      background: #16a34a;
      color: white;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 200;
    }

    .modal.show {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 360px;
      background: white;
      border-radius: 20px;
      padding: 24px;
    }

    .modal-box h2 {
      font-size: 21px;
      color: #111827;
      margin-bottom: 8px;
    }

    .modal-box p {
      color: #6b7280;
      font-size: 13px;
      margin-bottom: 18px;
      line-height: 1.5;
    }

    .report-option {
      width: 100%;
      padding: 13px;
      margin-bottom: 9px;
      border: 1px solid #e5e7eb;
      border-radius: 11px;
      background: white;
      text-align: left;
      cursor: pointer;
      font-size: 14px;
    }

    .report-option:hover {
      background: #f9fafb;
    }

    .cancel-btn {
      width: 100%;
      height: 45px;
      border: none;
      border-radius: 11px;
      background: #111827;
      color: white;
      font-weight: bold;
      margin-top: 8px;
      cursor: pointer;
    }

  </style>

</head>

<body>

  <main class="app">

    <header class="header">

      <div class="brand">
        Milo India
      </div>

      <div class="status">
        ● Online
      </div>

    </header>

    <section class="hero">

      <h1>
        Meet someone new
      </h1>

      <p>
        Start a random 1-to-1 video call with another online user.
      </p>

      <button
        id="randomButton"
        class="random-btn"
        type="button"
      >
        🎥 Start Random Video Call
      </button>

    </section>

    <h2 class="section-title">
      Live Online People
    </h2>

    <section
      id="users"
      class="users"
    >

      <div class="empty">
        Finding online people...
      </div>

    </section>

    <p
      id="message"
      class="message"
    ></p>

  </main>

  <div
    id="incomingCall"
    class="incoming"
  >

    <div class="incoming-box">

      <div class="incoming-icon">
        📹
      </div>

      <h2>
        Incoming Video Call
      </h2>

      <p>
        Someone wants to start a random video call with you.
      </p>

      <div class="incoming-buttons">

        <button
          id="declineButton"
          class="decline"
          type="button"
        >
          Decline
        </button>

        <button
          id="acceptButton"
          class="accept"
          type="button"
        >
          Accept
        </button>

      </div>

    </div>

  </div>

  <div
    id="reportModal"
    class="modal"
  >

    <div class="modal-box">

      <h2>
        Report User
      </h2>

      <p>
        Select the reason for reporting this user.
      </p>

      <button
        class="report-option"
        data-reason="Inappropriate behavior"
        type="button"
      >
        Inappropriate behavior
      </button>

      <button
        class="report-option"
        data-reason="Harassment"
        type="button"
      >
        Harassment
      </button>

      <button
        class="report-option"
        data-reason="Spam or scam"
        type="button"
      >
        Spam or scam
      </button>

      <button
        class="report-option"
        data-reason="Fake profile"
        type="button"
      >
        Fake profile
      </button>

      <button
        class="report-option"
        data-reason="Other"
        type="button"
      >
        Other
      </button>

      <button
        id="cancelReport"
        class="cancel-btn"
        type="button"
      >
        Cancel
      </button>

    </div>

  </div>

  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    import {
      getFirestore,
      collection,
      query,
      where,
      onSnapshot,
      addDoc,
      doc,
      updateDoc,
      getDocs,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

    import {
      firebaseConfig
    } from "./firebase-config.js";


    /* =====================================================
       FIREBASE
    ===================================================== */

    const app =
      initializeApp(firebaseConfig);

    const auth =
      getAuth(app);

    const db =
      getFirestore(app);


    /* =====================================================
       ELEMENTS
    ===================================================== */

    const onlineUsers =
      document.getElementById("users");

    const message =
      document.getElementById("message");

    const incomingCallBox =
      document.getElementById("incomingCall");

    const acceptCall =
      document.getElementById("acceptButton");

    const declineCall =
      document.getElementById("declineButton");

    const reportModal =
      document.getElementById("reportModal");

    const cancelReport =
      document.getElementById("cancelReport");

    const startRandomCallButton =
      document.getElementById("randomButton");

    const reportOptions =
      document.querySelectorAll(".report-option");


    /* =====================================================
       VARIABLES
    ===================================================== */

    let currentUser = null;

    let blockedUserIds = [];

    let reportUserId = null;

    let incomingCallId = null;

    let incomingCallerId = null;

    let onlineUsersUnsubscribe = null;

    let callListener = null;


    /* =====================================================
       AUTH
    ===================================================== */

    onAuthStateChanged(
      auth,
      async (user) => {

        if (!user) {

          window.location.href =
            "index.html";

          return;

        }

        currentUser =
          user;

        console.log(
          "Milo user logged in:",
          currentUser.uid
        );

        await loadBlockedUsers();

        loadOnlineUsers();

        listenForIncomingCalls();

      }
    );


    /* =====================================================
       RANDOM VIDEO CALL BUTTON
    ===================================================== */

    if (startRandomCallButton) {

      startRandomCallButton.addEventListener(
        "click",
        async () => {

          if (
            startRandomCallButton.disabled
          ) {

            return;

          }

          startRandomCallButton.disabled =
            true;

          startRandomCallButton.textContent =
            "🔎 Finding someone...";

          try {

            await startRandomCall();

          } finally {

            startRandomCallButton.disabled =
              false;

            startRandomCallButton.textContent =
              "🎥 Start Random Video Call";

          }

        }
      );

    }


    /* =====================================================
       LOAD BLOCKED USERS
    ===================================================== */

    async function loadBlockedUsers() {

      if (!currentUser) {

        return;

      }

      try {

        const q =
          query(
            collection(db, "blocks"),
            where(
              "blockerId",
              "==",
              currentUser.uid
            )
          );

        const snapshot =
          await getDocs(q);

        blockedUserIds = [];

        snapshot.forEach(
          (item) => {

            const data =
              item.data();

            if (
              data.blockedUserId
            ) {

              blockedUserIds.push(
                data.blockedUserId
              );

            }

          }
        );

        console.log(
          "Blocked users:",
          blockedUserIds
        );

      } catch (error) {

        console.error(
          "Block loading error:",
          error
        );

      }

    }


    /* =====================================================
       LOAD ONLINE USERS
    ===================================================== */

    function loadOnlineUsers() {

      if (!currentUser) {

        return;

      }

      if (onlineUsersUnsubscribe) {

        onlineUsersUnsubscribe();

        onlineUsersUnsubscribe =
          null;

      }

      const q =
        query(
          collection(db, "users"),
          where(
            "online",
            "==",
            true
          )
        );

      onlineUsersUnsubscribe =
        onSnapshot(
          q,

          (snapshot) => {

            if (!onlineUsers) {

              return;

            }

            onlineUsers.innerHTML =
              "";

            let foundUsers =
              false;

            snapshot.forEach(
              (item) => {

                const user =
                  item.data();

                user.id =
                  item.id;

                if (
                  user.id ===
                  currentUser.uid
                ) {

                  return;

                }

                if (
                  blockedUserIds.includes(
                    user.id
                  )
                ) {

                  return;

                }

                if (
                  Number(user.age) < 18
                ) {

                  return;

                }

                foundUsers =
                  true;

                const card =
                  createUserCard(user);

                onlineUsers.appendChild(
                  card
                );

              }
            );

            if (!foundUsers) {

              onlineUsers.innerHTML = `
                <div class="empty">
                  No online people right now.
                </div>
              `;

            }

          },

          (error) => {

            console.error(
              "Online users error:",
              error
            );

            if (onlineUsers) {

              onlineUsers.innerHTML = `
                <div class="empty">
                  Unable to load online people.
                </div>
              `;

            }

          }
        );

    }


    /* =====================================================
       CREATE USER CARD
    ===================================================== */

    function createUserCard(user) {

      const card =
        document.createElement("div");

      card.className =
        "user-card";

      const info =
        document.createElement("div");

      info.className =
        "user-info";

      const name =
        document.createElement("h3");

      name.textContent =
        user.name ||
        "Milo User";

      const details =
        document.createElement("p");

      details.textContent =
        `${user.age || "18+"} • ${
          user.gender || "Unknown"
        } • ${
          user.country || "Unknown"
        }`;

      const status =
        document.createElement("p");

      status.className =
        "online";

      status.textContent =
        "● Online";

      info.appendChild(name);

      info.appendChild(details);

      info.appendChild(status);

      const actions =
        document.createElement("div");

      actions.className =
        "user-actions";

      const callButton =
        document.createElement("button");

      callButton.className =
        "call-btn";

      callButton.type =
        "button";

      callButton.textContent =
        "📹 Call";

      callButton.addEventListener(
        "click",
        async () => {

          callButton.disabled =
            true;

          callButton.textContent =
            "Calling...";

          try {

            await startCall(user);

          } finally {

            callButton.disabled =
              false;

            callButton.textContent =
              "📹 Call";

          }

        }
      );

      const blockButton =
        document.createElement("button");

      blockButton.className =
        "small-btn block-btn";

      blockButton.type =
        "button";

      blockButton.textContent =
        "🚫 Block";

      blockButton.addEventListener(
        "click",
        async () => {

          await blockUser(
            user.id
          );

        }
      );

      const reportButton =
        document.createElement("button");

      reportButton.className =
        "small-btn report-btn";

      reportButton.type =
        "button";

      reportButton.textContent =
        "⚠️ Report";

      reportButton.addEventListener(
        "click",
        () => {

          openReportModal(
            user.id
          );

        }
      );

      actions.appendChild(
        callButton
      );

      actions.appendChild(
        blockButton
      );

      actions.appendChild(
        reportButton
      );

      card.appendChild(info);

      card.appendChild(actions);

      return card;

    }


    /* =====================================================
       START RANDOM VIDEO CALL
    ===================================================== */

    async function startRandomCall() {

      if (!currentUser) {

        alert(
          "Please wait. Your account is loading..."
        );

        return;

      }

      try {

        console.log(
          "Searching for online users..."
        );

        const q =
          query(
            collection(db, "users"),
            where(
              "online",
              "==",
              true
            )
          );

        const snapshot =
          await getDocs(q);

        const availableUsers =
          [];

        snapshot.forEach(
          (item) => {

            const user =
              item.data();

            user.id =
              item.id;

            if (
              user.id ===
              currentUser.uid
            ) {

              return;

            }

            if (
              blockedUserIds.includes(
                user.id
              )
            ) {

              return;

            }

            if (
              Number(user.age) < 18
            ) {

              return;

            }

            availableUsers.push(
              user
            );

          }
        );

        console.log(
          "Available random users:",
          availableUsers.length
        );

        if (
          availableUsers.length === 0
        ) {

          alert(
            "No online people available right now.\n\nPlease try again in a moment."
          );

          return;

        }

        const randomIndex =
          Math.floor(
            Math.random() *
            availableUsers.length
          );

        const randomUser =
          availableUsers[
            randomIndex
          ];

        console.log(
          "Random user selected:",
          randomUser
        );

        await startCall(
          randomUser
        );

      } catch (error) {

        console.error(
          "Random call error:",
          error
        );

        alert(
          "Unable to start random video call.\n\n" +
          error.message
        );

      }

    }
    /* =====================================================
       START VIDEO CALL
    ===================================================== */

    async function startCall(
      selectedUser
    ) {

      if (!currentUser) {

        alert(
          "Please login first."
        );

        return;

      }


      if (!selectedUser) {

        alert(
          "No user selected."
        );

        return;

      }


      try {

        console.log(
          "Starting call with:",
          selectedUser.id
        );


        /* =========================
           CREATE CALL
        ========================= */

        const callData = {

          callerId:
            currentUser.uid,

          receiverId:
            selectedUser.id,

          status:
            "ringing",

          createdAt:
            serverTimestamp()

        };


        const callRef =
          await addDoc(
            collection(
              db,
              "calls"
            ),
            callData
          );


        console.log(
          "Call created:",
          callRef.id
        );


        /* =========================
           OPEN VIDEO CALL PAGE
        ========================= */

        window.location.href =
          "video-call.html?callId=" +
          encodeURIComponent(
            callRef.id
          ) +
          "&role=caller";


      } catch (error) {

        console.error(
          "Call error:",
          error
        );


        alert(
          "Unable to start video call.\n\n" +
          error.message
        );

      }

    }


    /* =====================================================
       BLOCK USER
    ===================================================== */

    async function blockUser(
      blockedUserId
    ) {

      if (!currentUser) {

        return;

      }


      const confirmBlock =
        confirm(
          "Are you sure you want to block this user?"
        );


      if (!confirmBlock) {

        return;

      }


      try {

        await addDoc(
          collection(
            db,
            "blocks"
          ),
          {

            blockerId:
              currentUser.uid,

            blockedUserId:
              blockedUserId,

            createdAt:
              serverTimestamp()

          }
        );


        /* Immediately update local list */

        if (
          !blockedUserIds.includes(
            blockedUserId
          )
        ) {

          blockedUserIds.push(
            blockedUserId
          );

        }


        loadOnlineUsers();


        alert(
          "User blocked successfully."
        );


      } catch (error) {

        console.error(
          "Block error:",
          error
        );


        alert(
          "Unable to block user.\n\n" +
          error.message
        );

      }

    }


    /* =====================================================
       OPEN REPORT MODAL
    ===================================================== */

    function openReportModal(
      userId
    ) {

      reportUserId =
        userId;


      if (reportModal) {

        reportModal.classList.add(
          "show"
        );

      }

    }


    /* =====================================================
       CLOSE REPORT MODAL
    ===================================================== */

    function closeReportModal() {

      if (reportModal) {

        reportModal.classList.remove(
          "show"
        );

      }


      reportUserId =
        null;

    }


    /* =====================================================
       CANCEL REPORT
    ===================================================== */

    if (cancelReport) {

      cancelReport.addEventListener(
        "click",
        () => {

          closeReportModal();

        }
      );

    }


    /* =====================================================
       CLOSE REPORT OUTSIDE
    ===================================================== */

    if (reportModal) {

      reportModal.addEventListener(
        "click",
        (event) => {

          if (
            event.target ===
            reportModal
          ) {

            closeReportModal();

          }

        }
      );

    }


    /* =====================================================
       REPORT OPTIONS
    ===================================================== */

    reportOptions.forEach(
      (button) => {

        button.addEventListener(
          "click",
          async () => {

            if (
              !currentUser ||
              !reportUserId
            ) {

              return;

            }


            const reason =
              button.dataset.reason;


            if (!reason) {

              return;

            }


            button.disabled =
              true;


            try {

              await addDoc(
                collection(
                  db,
                  "reports"
                ),
                {

                  reporterId:
                    currentUser.uid,

                  reportedUserId:
                    reportUserId,

                  reason:
                    reason,

                  status:
                    "pending",

                  createdAt:
                    serverTimestamp()

                }
              );


              closeReportModal();


              alert(
                "Report submitted successfully."
              );


            } catch (error) {

              console.error(
                "Report error:",
                error
              );


              alert(
                "Unable to submit report.\n\n" +
                error.message
              );


            } finally {

              button.disabled =
                false;

            }

          }
        );

      }
    );


    /* =====================================================
       INCOMING CALLS
    ===================================================== */

    function listenForIncomingCalls() {

      if (
        callListener ||
        !currentUser
      ) {

        return;

      }


      const q =
        query(
          collection(
            db,
            "calls"
          ),

          where(
            "receiverId",
            "==",
            currentUser.uid
          ),

          where(
            "status",
            "==",
            "ringing"
          )
        );


      callListener =
        onSnapshot(
          q,

          async (snapshot) => {

            for (
              const item of
              snapshot.docChanges()
            ) {

              if (
                item.type !==
                "added"
              ) {

                continue;

              }


              const data =
                item.doc.data();


              /* =========================
                 BLOCKED CALLER CHECK
              ========================= */

              if (
                data.callerId &&
                blockedUserIds.includes(
                  data.callerId
                )
              ) {

                try {

                  await updateDoc(
                    doc(
                      db,
                      "calls",
                      item.doc.id
                    ),

                    {
                      status:
                        "blocked"
                    }
                  );

                } catch (error) {

                  console.error(
                    "Blocked call update error:",
                    error
                  );

                }


                continue;

              }


              incomingCallId =
                item.doc.id;


              incomingCallerId =
                data.callerId;


              if (
                incomingCallBox
              ) {

                incomingCallBox.classList.add(
                  "show"
                );

              }

            }

          },

          (error) => {

            console.error(
              "Incoming call listener error:",
              error
            );

          }
        );

    }


    /* =====================================================
       ACCEPT INCOMING CALL
    ===================================================== */

    if (acceptCall) {

      acceptCall.addEventListener(
        "click",
        async () => {

          if (
            !incomingCallId
          ) {

            return;

          }


          try {

            await updateDoc(
              doc(
                db,
                "calls",
                incomingCallId
              ),

              {
                status:
                  "accepted"
              }
            );


            /* =========================
               OPEN VIDEO CALL
            ========================= */

            window.location.href =
              "video-call.html?callId=" +
              encodeURIComponent(
                incomingCallId
              ) +
              "&role=receiver";


          } catch (error) {

            console.error(
              "Accept call error:",
              error
            );


            alert(
              "Unable to accept call.\n\n" +
              error.message
            );

          }

        }
      );

    }


    /* =====================================================
       DECLINE INCOMING CALL
    ===================================================== */

    if (declineCall) {

      declineCall.addEventListener(
        "click",
        async () => {

          if (
            !incomingCallId
          ) {

            return;

          }


          try {

            await updateDoc(
              doc(
                db,
                "calls",
                incomingCallId
              ),

              {
                status:
                  "declined"
              }
            );


            if (
              incomingCallBox
            ) {

              incomingCallBox.classList.remove(
                "show"
              );

            }


            incomingCallId =
              null;

            incomingCallerId =
              null;


          } catch (error) {

            console.error(
              "Decline call error:",
              error
            );

          }

        }
      );

    }


    /* =====================================================
       PAGE READY
    ===================================================== */

    console.log(
      "Milo India home script loaded successfully."
    );

  </script>

</body>

</html>
